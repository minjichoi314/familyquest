<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>패밀리 퀘스트 · 우리 반 갤러리</title><style>
*{box-sizing:border-box}body{font-family:'Malgun Gothic',sans-serif;background:#f5f7eb;color:#3d3129;margin:0}main{max-width:1100px;margin:auto;padding:20px}header,.panel,.card{background:#fffaf0;border:2px solid #e7d7ba;border-radius:23px;padding:20px;margin-bottom:14px}header{background:#e2efda}button,a.btn{display:inline-block;border:2px solid #a98a64;background:#fff5e2;border-radius:14px;padding:10px 16px;font:inherit;font-weight:700;color:inherit;text-decoration:none;cursor:pointer}button.primary{background:#9fd4a0}button:disabled{opacity:.55}input{font:inherit;padding:10px;border:1px solid #c9b99e;border-radius:10px;max-width:100%;width:240px}label{display:grid;gap:5px;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}.answer{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6eee2;border-radius:10px;padding:10px;margin:8px 0}.pictures{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.pictures img{width:100%;aspect-ratio:16/9;object-fit:contain;border:1px solid #ddd;border-radius:8px}#status{font-weight:700}#login{max-width:500px;margin:30px auto}body:not(.authed) #app{display:none}body.authed #login{display:none}.selected{background:#b8dca7}small{color:#6d6255}
</style></head><body><main><header><h1>🏡 패밀리 퀘스트 · 우리 반 작품 갤러리</h1><p>같은 반 친구들의 작품만 볼 수 있어요. 실명·연락처 등 개인정보는 쓰지 마세요.</p><a class="btn" href="./index.html">← 게임으로 돌아가기</a></header>
<section id="login" class="panel"><h2>🔐 학급 로그인</h2><p>선생님이 발급한 계정으로 로그인하세요.</p><form id="loginForm"><label>계정 이메일<input required id="email" type="email" autocomplete="username"></label><label>비밀번호<input required id="password" type="password" autocomplete="current-password"></label><label>학급 코드<input required id="room" placeholder="예: class-2026" pattern="[a-z0-9-]{4,30}"></label><button class="primary" type="submit">우리 반 로그인</button></form></section>
<div id="app"><section class="panel"><div class="row"><strong id="identity"></strong><button id="logout">로그아웃</button></div><h2>친구들의 미션 결과</h2><div id="tabs" class="row"></div><p id="status" role="status"></p><div class="row"><button id="publish" class="primary">📤 내 미션 결과 바로 공유</button><button id="refresh">🔄 새로고침</button></div><small>공유 버튼을 누르면 반 친구들에게 즉시 공개됩니다. 게시 전에 내용과 그림을 확인하세요.</small></section><section id="posts"></section></div><p id="error" role="alert"></p></main>
<script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,query,orderBy,serverTimestamp,deleteDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {getStorage,ref as storageRef,uploadBytes,getDownloadURL} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const $=id=>document.getElementById(id),missions={read:'책읽기',m1:'미션 1 · 갈등 탐색',m2:'미션 2 · 나 전달법',m3:'미션 3 · 공익광고'},names={read:['인상 깊은 장면','가족의 행동','나의 생각'],m1:['엄마의 생각','아빠의 생각','아들의 생각'],m2:['엄마의 대화','아빠의 대화','아들의 대화'],m3:['문제 상황','가족의 마음','바뀐 대화','함께 실천하기','행복한 결말']};
let room=sessionStorage.getItem('fq-classroom')||'',nick='',uid='',mission=new URLSearchParams(location.search).get('mission')||'read';if(!missions[mission])mission='read';$('room').value=room;
function msg(s){$('status').textContent=s;$('error').textContent=''}function fail(e){$('error').textContent='오류: '+(e?.message||e)}
async function authorize(user,r){if(!user||!/^[a-z0-9-]{4,30}$/.test(r))throw Error('학급 코드를 확인하세요.');const m=await getDoc(doc(db,'classrooms',r,'members',user.uid));if(!m.exists())throw Error('이 반에 등록된 계정이 아닙니다. 선생님에게 확인하세요.');room=r;uid=user.uid;nick=String(m.data().nick||'학생').slice(0,20);sessionStorage.setItem('fq-classroom',r);document.body.classList.add('authed');$('identity').textContent=`${nick} · ${room}`;renderTabs();await loadPosts()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{$('error').textContent='로그인 확인 중…';const r=$('room').value.trim().toLowerCase();const c=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await authorize(c.user,r)}catch(e){fail(e)}});
onAuthStateChanged(auth,async u=>{if(u&&room){try{await authorize(u,room)}catch(e){document.body.classList.remove('authed');fail(e)}}});
$('logout').onclick=async()=>{await signOut(auth);uid='';sessionStorage.removeItem('fq-classroom');room='';document.body.classList.remove('authed')};
function renderTabs(){const box=$('tabs');box.replaceChildren();for(const [key,title] of Object.entries(missions)){const b=document.createElement('button');b.textContent=title;if(key===mission)b.className='selected';b.onclick=()=>{mission=key;history.replaceState({},'',`?mission=${key}`);renderTabs();loadPosts()};box.append(b)}}
function gameData(){try{return JSON.parse(localStorage.getItem('family-quest-2026-pigfamily-v4')||'{}')}catch{return {}}}
function selections(d){const f=d.fields||{};if(mission==='read')return [1,2,3].map(i=>({title:names.read[i-1],value:f[`read-${i}`]||''}));if(mission==='m1')return [0,1,2].map(i=>({title:names.m1[i],value:[0,1,2].map(j=>f[`m1-${i}-${j}`]||'').concat(f[`m1-${i}-why`]||'').filter(Boolean).join(' / ')}));if(mission==='m2')return [0,1,2].map(i=>({title:names.m2[i],value:['a','b','c'].map(j=>f[`m2-${i}-${j}`]||'').filter(Boolean).join(' / ')}));return [0,1,2,3,4].map(i=>({title:names.m3[i],value:f[`m3-desc-${i}`]||''}))}
function make(tag,content){const el=document.createElement(tag);el.textContent=content;return el}
async function publish(){if(!uid)return;const d=gameData();const idx=Object.keys(missions).indexOf(mission);if(!d.completed?.[idx])return msg('먼저 게임에서 이 미션을 완료해 도장을 받으세요.');const answers=selections(d).map(a=>({title:a.title,value:a.value.trim().slice(0,1400)}));if(answers.some(a=>!a.value))return msg('작성되지 않은 답변이 있습니다.');if(!confirm(`${missions[mission]} 수행 결과를 지금 반 친구들에게 공유할까요?`))return;$('publish').disabled=true;try{msg('게시 중입니다…');const images=[];if(mission==='m3'){for(let i=0;i<5;i++){const data=d.scenes?.[i]?.image;if(!data?.startsWith('data:image/'))throw Error(`장면 ${i+1} 그림이 없습니다.`);const blob=await (await fetch(data)).blob();if(blob.size>1024*1024)throw Error(`장면 ${i+1} 이미지가 너무 큽니다 (1MB 제한).`);const file=storageRef(storage,`classrooms/${room}/${uid}/m3/scene-${i+1}.jpg`);const pic=await createImageBitmap(blob),c=document.createElement('canvas');c.width=800;c.height=450;c.getContext('2d').drawImage(pic,0,0,800,450);const compressed=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.73));await uploadBytes(file,compressed,{contentType:'image/jpeg'});images.push(await getDownloadURL(file))}}
const target=doc(db,'classrooms',room,'posts',`${uid}_${mission}`),old=await getDoc(target);await setDoc(target,{owner:uid,nick,mission,answers,images,createdAt:old.exists()?old.data().createdAt:serverTimestamp(),updatedAt:serverTimestamp()});msg('우리 반에 공유되었습니다!');await loadPosts()}catch(e){fail(e)}finally{$('publish').disabled=false}}
async function loadPosts(){if(!uid)return;try{msg('친구 작품을 불러오는 중…');const snap=await getDocs(query(collection(db,'classrooms',room,'posts'),orderBy('createdAt','desc'))),root=$('posts');root.replaceChildren();let count=0;for(const d of snap.docs){const p=d.data();if(p.mission!==mission)continue;count++;const card=make('article','');card.className='card';card.append(make('h3',`${p.nick||'학생'} · ${missions[mission]}`));for(const a of p.answers||[]){card.append(make('strong',a.title));const div=make('div',a.value);div.className='answer';card.append(div)}if(p.images?.length){const pics=make('div','');pics.className='pictures';p.images.forEach((url,i)=>{if(typeof url!=='string'||!url.startsWith('https://'))return;const image=document.createElement('img');image.src=url;image.alt=`장면 ${i+1}`;image.loading='lazy';pics.append(image)});card.append(pics)}if(p.owner===uid){const btn=make('button','내 작품 삭제');btn.onclick=async()=>{if(!confirm('게시된 내 작품을 삭제할까요?'))return;await deleteDoc(doc(db,'classrooms',room,'posts',d.id));await loadPosts()};card.append(btn)}root.append(card)}msg(`${missions[mission]} · 공유된 작품 ${count}개`)}catch(e){fail(e)}}
$('publish').onclick=publish;$('refresh').onclick=loadPosts;
</script></body></html>
